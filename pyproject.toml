[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-abliterate"
version = "0.1.0"
description = "Memory-bounded MLX abliteration research tools and Ollama fidelity checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Samuel Barber"}]
dependencies = []

[project.scripts]
mlx-abliterate = "mlx_abliterate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
