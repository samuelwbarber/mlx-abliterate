[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-abliterate"
version = "0.1.0"
description = "Memory-bounded MLX abliteration research tools and Ollama fidelity checks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Samuel Barber"}]
dependencies = []

[project.optional-dependencies]
data = ["pyarrow==26.0.1"]
mlx = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
runtime = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'", "mlx-vlm==0.7.12; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
mlx-abliterate = "mlx_abliterate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
